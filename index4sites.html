    <script>
    // Seleziona gli elementi dal DOM
const canvas = new fabric.Canvas('drawingCanvas', {
    isDrawingMode: true,
    width: window.innerWidth,
    height: 2000,
});
// Riferimenti agli elementi
const drawingCanvas = document.getElementById("drawingCanvas");
const drawingContext = drawingCanvas.getContext("2d");
const selectionCanvas = document.getElementById("selectionCanvas");
const selectionContext = selectionCanvas.getContext("2d");
const activateSelectionBtn = document.getElementById("activateSelection");

let isSelecting = false;
let startX, startY, endX, endY;

// Pulsante per attivare/disattivare la modalità di selezione
activateSelectionBtn.addEventListener("click", () => {
    isSelecting = !isSelecting;
    activateSelectionBtn.textContent = isSelecting ? "Disattiva selezione OCR" : "Attiva selezione OCR";

    // Pulisce eventuali selezioni precedenti
    if (!isSelecting) {
        selectionContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
    }
});

// Evento mousedown per iniziare la selezione
selectionCanvas.addEventListener("mousedown", (event) => {
    if (isSelecting) {
        startX = event.offsetX;
        startY = event.offsetY;
    }
});

// Evento mousemove per tracciare il riquadro di selezione
selectionCanvas.addEventListener("mousemove", (event) => {
    if (isSelecting) {
        endX = event.offsetX;
        endY = event.offsetY;
        
        // Pulisce il canvas e disegna il riquadro di selezione
        selectionContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
        selectionContext.beginPath();
        selectionContext.rect(startX, startY, endX - startX, endY - startY);
        selectionContext.lineWidth = 2;
        selectionContext.strokeStyle = "red";
        selectionContext.stroke();
    }
});

// Evento mouseup per catturare l'area selezionata e avviare l'OCR
selectionCanvas.addEventListener("mouseup", async () => {
    if (isSelecting) {
        isSelecting = false;
        activateSelectionBtn.textContent = "Attiva selezione OCR";
        
        // Definisce le dimensioni dell'area selezionata
        const width = Math.abs(endX - startX);
        const height = Math.abs(endY - startY);
        const x = Math.min(startX, endX);
        const y = Math.min(startY, endY);

        if (width > 0 && height > 0) {
            // Estrai l'immagine dell'area selezionata
            const imageData = drawingContext.getImageData(x, y, width, height);
            
            // Canvas offscreen per la conversione dell'immagine
            const offscreenCanvas = document.createElement("canvas");
            offscreenCanvas.width = width;
            offscreenCanvas.height = height;
            const offscreenContext = offscreenCanvas.getContext("2d");
            offscreenContext.putImageData(imageData, 0, 0);

            // Avvia l'OCR con Tesseract
            offscreenCanvas.toBlob(async (blob) => {
                try {
                    const result = await Tesseract.recognize(blob, 'eng', { logger: (m) => console.log(m) });
                    const ocrText = result.data.text.trim();
                    document.getElementById('display').value += ocrText;
                } catch (error) {
                    alert("Errore OCR: impossibile riconoscere il testo.");
                }
            });
        } else {
            alert("Selezione non valida. Riprova.");
        }

        // Pulisce il riquadro di selezione
        selectionContext.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
    }
});

// Strumenti
const penTool = document.getElementById('penTool');
const eraserTool = document.getElementById('eraserTool');
const lineTool = document.getElementById('lineTool');
const savePDF = document.getElementById('savePDF');
const clearStorageBtn = document.getElementById('clearStorage'); // Bottone per cancellare i dati
const calcolatrice = document.getElementById('calcolatrice');
const colorPicker = document.getElementById('colorPicker');
const brushSize = document.getElementById('brushSize');
const aggiungiPaginaBtn = document.getElementById('aggiungiPagina');
const selettorePagine = document.getElementById('selettorePagine');
const undoBtn = document.getElementById('undo');
const redoBtn = document.getElementById('redo');
const ultimoNomeFileBtn = document.getElementById('ultimoNomeFile');

// Stato iniziale
let drawingMode = 'pen';
let isDrawingLine = false;
let line;
let pagine = [];
let paginaAttuale = 0;
let undoStack = [];
let redoStack = [];

// Funzione per salvare lo stato attuale in localStorage
// Funzione per salvare lo stato attuale in localStorage con nome file dinamico
function salvaInLocalStorage() {
    const now = new Date();
    const data = now.toISOString().split('T')[0]; // Ottiene la data in formato YYYY-MM-DD
    const ora = now.toTimeString().split(' ')[0].replace(/:/g, '-'); // Ottiene l'ora in formato HH-MM-SS
    const nomeFile = `disegno_${data}_${ora}`; // Nome del file nel formato "disegno_YYYY-MM-DD_HH-MM-SS"
    
    // Salva il contenuto delle pagine con il nome dinamico
    localStorage.setItem(nomeFile, JSON.stringify(pagine));

    // Opzionale: salva l'ultimo nome file usato per riferimento futuro
    localStorage.setItem('ultimoNomeFile', nomeFile);
}
const ultimoNomeFile = localStorage.getItem('ultimoNomeFile');


// Funzione per cancellare i dati salvati
function clearStorage() {
    localStorage.removeItem('pagine');  // Rimuove i dati salvati
    pagine = [];
    selettorePagine.innerHTML = '';  // Pulisce il selettore
    canvas.clear();  // Pulisce il canvas
    paginaAttuale = 0;
    alert("Dati salvati cancellati. La lavagna è stata reimpostata.");
}

// Funzione per salvare lo stato corrente per Annulla/Ripristina
function saveState() {
    undoStack.push(JSON.stringify(canvas.toJSON()));
    redoStack = []; // Pulisce lo stack redo dopo una nuova azione
}

// Modalità Penna
penTool.addEventListener('click', () => {
    canvas.isDrawingMode = true;
    drawingMode = 'pen';
    canvas.freeDrawingBrush.color = colorPicker.value;
    canvas.freeDrawingBrush.width = parseInt(brushSize.value, 10);
    canvas.off('mouse:down');
    canvas.off('mouse:move');
});

// Modalità Gomma (singolo tocco e riconoscimento del palmo)
eraserTool.addEventListener('click', () => {
    canvas.isDrawingMode = false;
    drawingMode = 'eraser';
    canvas.off('mouse:down');
    canvas.off('mouse:move');
    canvas.on('mouse:down', (opt) => {
        const pointer = canvas.getPointer(opt.e);
        canvas.getObjects().forEach(obj => {
            if (obj.containsPoint(pointer)) {
                canvas.remove(obj);
                saveState();  // Salva lo stato dopo la rimozione
            }
        });
    });
});

// Modalità Linea
lineTool.addEventListener('click', () => {
    drawingMode = 'line';
    canvas.isDrawingMode = false;
    isDrawingLine = false;
    canvas.off('mouse:down');
    canvas.off('mouse:move');
    canvas.on('mouse:down', (opt) => {
        if (drawingMode === 'line') {
            const pointer = canvas.getPointer(opt.e);
            if (!isDrawingLine) {
                isDrawingLine = true;
                line = new fabric.Line([pointer.x, pointer.y, pointer.x, pointer.y], {
                    stroke: colorPicker.value,
                    strokeWidth: parseInt(brushSize.value, 10),
                    selectable: false
                });
                canvas.add(line);
                saveState();
            } else {
                isDrawingLine = false;
            }
        }
    });
    canvas.on('mouse:move', (opt) => {
        if (isDrawingLine && line) {
            const pointer = canvas.getPointer(opt.e);
            line.set({ x2: pointer.x, y2: pointer.y });
            canvas.renderAll();
        }
    });
});

// Cambia colore e dimensione del pennello
colorPicker.addEventListener('input', () => {
    if (drawingMode === 'pen') {
        canvas.freeDrawingBrush.color = colorPicker.value;
    }
});

brushSize.addEventListener('input', () => {
    if (drawingMode === 'pen') {
        canvas.freeDrawingBrush.width = parseInt(brushSize.value, 10);
    }
});

// Funzione per aggiungere una nuova pagina con lavagna pulita
// Aggiunge una nuova pagina
function aggiungiPagina() {
    // Salva il contenuto della pagina corrente
    if (pagine.length > 0) {
        const canvasData = canvas.toJSON();
        pagine[selettorePagine.value].canvasData = canvasData;
    }

    // Crea una nuova pagina con nome incrementale
    const nuovaPagina = { canvasData: null, paginaNome: `Pagina ${pagine.length + 1}`
    };
    pagine.push(nuovaPagina);
    salvaInLocalStorage();
    aggiornaSelettorePagine(); // Aggiorna il selettore per includere la nuova pagina
    selettorePagine.value = pagine.length - 1;

    // Pulisce la lavagna e salva lo stato
    canvas.clear();
    saveState();
    salvaInLocalStorage();
}

// Aggiorna l'elenco delle opzioni nel selettore in base all'ordine di `pagine`
function aggiornaSelettorePagine() {
    selettorePagine.innerHTML = ''; // Svuota il selettore
    pagine.forEach((pagina, index) => {
        const opzione = new Option(pagina.paginaNome, index);
        selettorePagine.appendChild(opzione);
    });
}

// Cambia l'ordine di una pagina (direzione: 'su' o 'giù')
function cambiaOrdinePagina(indicePagina, direzione) {
    if ((indicePagina <= 0 && direzione === 'su') || (indicePagina >= pagine.length - 1 && direzione === 'giù')) {
        return; // Impedisce spostamenti fuori dall'indice dell'array
    }

    // Determina il nuovo indice in base alla direzione
    const nuovoIndice = direzione === 'su' ? indicePagina - 1 : indicePagina + 1;

    // Scambia le pagine nell'array
    [pagine[indicePagina], pagine[nuovoIndice]] = [pagine[nuovoIndice], pagine[indicePagina]];

    // Rinomina le pagine per riflettere il nuovo ordine
    pagine.forEach((pagina, index) => {
        pagina.paginaNome = `Pagina ${index + 1}`;
    });

    aggiornaSelettorePagine(); // Aggiorna il selettore con il nuovo ordine
    selettorePagine.value = nuovoIndice; // Seleziona la pagina appena spostata
    salvaInLocalStorage(); // Salva il nuovo ordine in localStorage
}

// Funzione per selezionare una pagina
function selezionaPagina(index) {
    if (index < 0 || index >= pagine.length) {
        console.error('Indice pagina non valido');
        return;
    }
    pagine[paginaAttuale].canvasData = canvas.toJSON();  // Salva la pagina attuale prima di cambiarla
    salvaInLocalStorage();

    paginaAttuale = index;
    canvas.clear();  // Pulisce il canvas prima di caricare
    canvas.loadFromJSON(pagine[index].canvasData, () => {
        canvas.renderAll();
        saveState(); // Salva lo stato iniziale della pagina caricata
    });
}
//stampa PDF
function salvaPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    pagine.forEach((pagina, index) => {
        // Carica i dati della pagina salvata nel canvas principale
        canvas.loadFromJSON(pagina.canvasData, () => {
            // Converte il canvas in dati immagine
            const imgData = canvas.toDataURL('image/png');
            
            // Calcola le dimensioni in base alle proporzioni del canvas
            const pdfWidth = doc.internal.pageSize.getWidth();
            const pdfHeight = doc.internal.pageSize.getHeight();
            const canvasWidth = canvas.width;
            const canvasHeight = canvas.height;
            const aspectRatio = canvasWidth / canvasHeight;

            // Imposta le dimensioni per l'immagine
            const imgHeight = pdfWidth / aspectRatio;
            const yPosition = (pdfHeight - imgHeight) / 2;

            if (index > 0) doc.addPage();
            doc.addImage(imgData, 'PNG', 10, yPosition, pdfWidth - 20, imgHeight);
            
            // Renderizza il PDF dopo aver caricato tutte le pagine
            if (index === pagine.length - 1) {
                const fileName = prompt("Inserisci il nome per il PDF:", "disegno") || "disegno";
                doc.save(`${fileName}.pdf`);
            }
        });
    });
}a

// Funzione per Annullare l'ultima azione
function undo() {
    if (undoStack.length > 0) {
        redoStack.push(JSON.stringify(canvas.toJSON()));
        const previousState = undoStack.pop();
        canvas.loadFromJSON(previousState, () => canvas.renderAll());
    }
}

// Funzione per Rifare l'ultima azione annullata
function redo() {
    if (redoStack.length > 0) {
        undoStack.push(JSON.stringify(canvas.toJSON()));
        const nextState = redoStack.pop();
        canvas.loadFromJSON(nextState, () => canvas.renderAll());
    }
}

// Eventi
aggiungiPaginaBtn.addEventListener('click', aggiungiPagina);
selettorePagine.addEventListener('change', () => selezionaPagina(selettorePagine.value));
savePDF.addEventListener('click', salvaPDF);
undoBtn.addEventListener('click', undo);
redoBtn.addEventListener('click', redo);
clearStorageBtn.addEventListener('click', clearStorage); 
ultimoNomeFileBtn.addEventListener('click',ultimoNomeFile)
// Assegna la funzione di cancellazione

// Carica le pagine dal localStorage (se presenti)
const pagineSalvate = localStorage.getItem('pagine');
if (pagineSalvate) {
    pagine = JSON.parse(pagineSalvate);
    pagine.forEach((pagina, index) => {
        const nuovaOpzione = new Option(`Pagina ${index + 1}`, index);
        selettorePagine.appendChild(nuovaOpzione);
    });
    paginaAttuale = 0;  // Seleziona la prima pagina all'apertura
    selettorePagine.value = paginaAttuale;
    selezionaPagina(paginaAttuale);
} else {
    pagine = []; // Inizializza un array vuoto se non ci sono dati salvati
    const nuovaPagina = { canvasData: null, paginaNome: 'Pagina 1' };
    pagine.push(nuovaPagina); // Crea la prima pagina
    const nuovaOpzione = new Option('Pagina 1', 0);
    selettorePagine.appendChild(nuovaOpzione);
    paginaAttuale = 0;  // Seleziona la prima pagina all'apertura
    selezionaPagina(paginaAttuale);
}

// Imposta il valore del selettore di pagine corrente
selettorePagine.value = paginaAttuale;

// // Funzione per aprire la calcolatrice in un popup
    // Funzioni 
    function appendDisplay(value) {
        document.getElementById('display').value += value;
    }

    function clearDisplay() {
        document.getElementById('display').value = '';
    }

    function calculate() {
        try {
            let result = eval(document.getElementById('display').value);
            document.getElementById('display').value = result;
        } catch (e) {
            alert("Errore di calcolo");
            clearDisplay();
        }
    }

        // Funzione per modificare lo sfondo della lavagna
        function cambiaSfondoLavagna(colore = null, immagine = null) {
            const lavagna = document.getElementById('lavagna');
    
            if (colore) {
                lavagna.style.backgroundColor = colore;
                lavagna.style.backgroundImage = ''; // Rimuove l'immagine se impostato
            } else if (immagine) {
                const urlImmagine = URL.createObjectURL(immagine);
                lavagna.style.backgroundImage = `url(${urlImmagine})`;
                lavagna.style.backgroundColor = ''; // Rimuove il colore se impostato
                lavagna.style.backgroundSize = 'cover';
                lavagna.style.backgroundRepeat = 'no-repeat';
            }
        }
    
        // Event listener per cambiare il colore di sfondo
        document.getElementById('coloreSfondo').addEventListener('input', (event) => {
            cambiaSfondoLavagna(event.target.value, null);
        });
    
        // Event listener per caricare un'immagine di sfondo
        document.getElementById('immagineSfondo').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                cambiaSfondoLavagna(null, file);
            }
        });

 });
    
    </script>
